<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>رسائل الضيوف — ياسمين وكريم</title>
<meta name="description" content="Sweet notes and well-wishes from family and friends.">
<meta name="theme-color" content="#AD8A4E">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>💍</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Italiana&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Beau+Rivage&family=Jost:wght@300;400;500;600&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-nav" id="site-nav">
  <div class="nav-inner" style="justify-content:center;position:relative;">
    <a href="index.html" class="nav-monogram" aria-label="Back to home" style="color:var(--accent-deep);">Y&amp;K</a>
    <a href="index.html" id="back-link" style="position:absolute;inset-inline-start:2rem;display:flex;align-items:center;gap:0.5rem;text-decoration:none;color:var(--text-main);font-size:0.85rem;letter-spacing:1px;text-transform:uppercase;">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="msg-back">الدعوة</span>
    </a>
    <button id="lang-toggle" class="lang-toggle" aria-label="Switch Language" style="position:absolute;inset-inline-end:2rem;">AR</button>
  </div>
</header>

<main id="main" style="padding-top:100px;">

  <!-- Banner -->
  <section class="container" style="text-align:center;padding:4rem 1rem 2rem;">
    <p class="eyebrow" data-i18n="msg-eyebrow">بكل الحب</p>
    <h1 class="section-title" data-i18n="msg-title">رسائل الضيوف</h1>
    <p data-i18n="msg-desc">كل أمنية وكلمة ودعاء تركها لنا أهلنا وأصدقاؤنا.</p>
  </section>

  <!-- Stats Grid -->
  <section class="container" style="max-width:900px;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1.5rem;margin-bottom:3rem;">

    <div class="stat-card" style="background:var(--bg-ivory,#FAF6EF);padding:2rem;border-radius:var(--radius-md,12px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.03);border:1px solid rgba(173,138,78,0.1);">
      <svg viewBox="0 0 24 24" width="28" height="28" style="color:var(--accent);margin:0 auto 1rem;display:block;" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 21s-7.5-4.7-10.2-9.3C.3 8.8 1.6 5 5.3 4.1c2-.5 4 .3 5.2 2 1.2-1.7 3.2-2.5 5.2-2 3.7.9 5 4.7 3.5 7.6C19.5 16.3 12 21 12 21z"/></svg>
      <div id="stat-total-messages" style="font-size:2.5rem;font-family:var(--font-heading);color:var(--text-main);line-height:1;">0</div>
      <div style="font-size:0.85rem;letter-spacing:1px;text-transform:uppercase;color:var(--text-soft);margin-top:0.5rem;" data-i18n="msg-stat-messages">الرسائل</div>
    </div>

    <div class="stat-card" style="background:var(--bg-ivory,#FAF6EF);padding:2rem;border-radius:var(--radius-md,12px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.03);border:1px solid rgba(173,138,78,0.1);">
      <svg viewBox="0 0 24 24" width="28" height="28" style="color:var(--accent);margin:0 auto 1rem;display:block;" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.2c2.8.4 4.9 2.4 4.9 5.8"/></svg>
      <div id="stat-total-guests" style="font-size:2.5rem;font-family:var(--font-heading);color:var(--text-main);line-height:1;">0</div>
      <div style="font-size:0.85rem;letter-spacing:1px;text-transform:uppercase;color:var(--text-soft);margin-top:0.5rem;" data-i18n="msg-stat-guests">الضيوف</div>
    </div>

    <div class="stat-card" style="background:var(--bg-ivory,#FAF6EF);padding:2rem;border-radius:var(--radius-md,12px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.03);border:1px solid rgba(173,138,78,0.1);">
      <svg viewBox="0 0 24 24" width="28" height="28" style="color:var(--accent);margin:0 auto 1rem;display:block;" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 6.5l9 6.5 9-6.5"/></svg>
      <div id="stat-latest-message" style="font-size:1.15rem;font-family:var(--font-heading);color:var(--text-main);line-height:1.4;min-height:2.5rem;display:flex;align-items:center;justify-content:center;">—</div>
      <div style="font-size:0.85rem;letter-spacing:1px;text-transform:uppercase;color:var(--text-soft);margin-top:0.5rem;" data-i18n="msg-stat-latest">أحدث رسالة</div>
    </div>

  </section>

  <!-- Search & Sort -->
  <section class="container" style="max-width:900px;display:flex;flex-wrap:wrap;gap:1rem;align-items:center;margin-bottom:3rem;">
    <div style="flex:1;position:relative;min-width:250px;">
      <svg viewBox="0 0 24 24" width="20" height="20" id="search-icon" style="position:absolute;inset-inline-start:1rem;top:50%;transform:translateY(-50%);color:var(--accent);" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input
        type="text"
        id="msg-search"
        data-i18n-placeholder="msg-search-placeholder"
        placeholder="ابحث باسم الضيف…"
        style="width:100%;padding:1rem 1rem 1rem 3rem;border-radius:50px;border:1px solid rgba(173,138,78,0.4);background:transparent;font-family:var(--font-body);color:var(--text-main);outline:none;"
      >
    </div>
    <select id="msg-sort" style="padding:1rem 2rem;border-radius:50px;border:1px solid rgba(173,138,78,0.4);background:transparent;font-family:var(--font-body);color:var(--text-main);outline:none;cursor:pointer;">
      <option value="newest" data-i18n="msg-sort-newest">الأحدث أولاً</option>
      <option value="oldest" data-i18n="msg-sort-oldest">الأقدم أولاً</option>
    </select>
  </section>

  <!-- Messages Grid -->
  <section class="container" style="max-width:1100px;padding-bottom:5rem;">
    <div id="messages-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2rem;"></div>
  </section>

</main>

<!-- FOOTER -->
<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-monogram">Y &amp; K</div>
    <p class="footer-names">Yasmine &amp; Karim</p>
    <p class="footer-credit"><span data-i18n="footer-credit">Crafted with love</span></p>
  </div>
</footer>

<button class="back-to-top" id="back-to-top" aria-label="Back to top">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
</button>

<script src="script.js"></script>
</body>
</html>
